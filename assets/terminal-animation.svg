<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Terminal animada: del reconocimiento a root">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9FEF00"/>
      <stop offset="50%" stop-color="#F7931E"/>
      <stop offset="100%" stop-color="#9FEF00"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .mono { font-family: "Fira Code","JetBrains Mono",Consolas,"Courier New",monospace; }
      .prompt { fill: #9FEF00; }
      .cmd { fill: #e6edf3; }
      .out { fill: #8b949e; }
      .ok { fill: #F7931E; }
      .root { fill: #ff3e3e; font-weight: 700; }
      .cursor { fill: #9FEF00; }
    </style>
  </defs>

  <rect x="1" y="1" width="858" height="298" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="858" height="298" rx="12" fill="none" stroke="url(#neon)" stroke-width="1.5" opacity="0.55"/>

  <!-- barra de ventana -->
  <circle cx="26" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="26" r="6" fill="#27c93f"/>
  <text x="852" y="31" text-anchor="end" class="mono" font-size="12" fill="#484f58">kur0s4k1@htb:~$</text>
  <line x1="1" y1="44" x2="859" y2="44" stroke="#21262d" stroke-width="1"/>

  <!-- scanline -->
  <rect x="1" y="44" width="858" height="40" fill="#9FEF00" opacity="0.05">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 256; 0 0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- cursor parpadeante permanente -->
  <rect x="826" y="258" width="10" height="18" class="cursor">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== líneas que aparecen y se reinician en bucle (12s) ===== -->
  <!-- 1: nmap -->
  <text x="22" y="80" class="mono" font-size="15" opacity="0"><tspan class="prompt">$ </tspan><tspan class="cmd">nmap -p- -sV target</tspan>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.90;1" dur="12s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="22" y="102" class="mono" font-size="14" opacity="0"><tspan class="out">22/tcp open ssh · 3389/tcp open ms-wbt-server</tspan>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.90;1" dur="12s" begin="0.7s" repeatCount="indefinite"/>
  </text>

  <!-- 2: id -->
  <text x="22" y="128" class="mono" font-size="15" opacity="0"><tspan class="prompt">$ </tspan><tspan class="cmd">id</tspan>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.90;1" dur="12s" begin="1.4s" repeatCount="indefinite"/>
  </text>
  <text x="22" y="150" class="mono" font-size="14" opacity="0"><tspan class="out">groups=1001(contractor),27(sudo),111(netdev),</tspan><tspan fill="#9FEF00">121(wireshark)</tspan>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.90;1" dur="12s" begin="2.1s" repeatCount="indefinite"/>
  </text>

  <!-- 3: tshark -->
  <text x="22" y="176" class="mono" font-size="15" opacity="0"><tspan class="prompt">$ </tspan><tspan class="cmd">tshark -Y "http.request.method == POST"</tspan>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.90;1" dur="12s" begin="2.8s" repeatCount="indefinite"/>
  </text>
  <text x="22" y="198" class="mono" font-size="14" opacity="0"><tspan class="out">POST /miles/login.php  </tspan><tspan class="ok">→ credencial en claro capturada</tspan>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.90;1" dur="12s" begin="3.5s" repeatCount="indefinite"/>
  </text>

  <!-- 4: exploit a root -->
  <text x="22" y="224" class="mono" font-size="15" opacity="0"><tspan class="prompt">$ </tspan><tspan class="cmd">python3 poc_CVE-2026-34990.py</tspan>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.90;1" dur="12s" begin="4.2s" repeatCount="indefinite"/>
  </text>
  <text x="22" y="246" class="mono" font-size="14" opacity="0"><tspan class="out">[+] wrote /etc/sudoers.d/aporter-pwn</tspan>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.90;1" dur="12s" begin="4.9s" repeatCount="indefinite"/>
  </text>

  <!-- 5: root -->
  <g opacity="0">
    <text x="22" y="272" class="mono" font-size="16"><tspan class="root">uid=0(root) gid=0(root)</tspan><tspan class="ok">  🚩 root.txt</tspan></text>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.90;1" dur="12s" begin="5.6s" repeatCount="indefinite"/>
  </g>
</svg>
